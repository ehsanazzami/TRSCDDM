          "html": "<div style=\"display:inline-block;text-align:left;max-width:800px\">\n<h3>Informed Consent</h3>\n<h4>Purpose of the Study</h4>\n<p>The purpose of this study is to investigate how adults make decisions about shared resources in group settings. You will be asked to complete a brief questionnaire and a short decision-making activity involving hypothetical tokens. The study is part of Ehsan Azzami’s doctoral dissertation in clinical psychology under the supervision of Krystal Piumatti, Psy.D.</p>\n<h4>Procedure</h4>\n<p>If you agree to participate, you will be asked to do the following:</p>\n<p>Complete demographic questions and questionnaires about general attitudes and response tendencies. Complete a short group decision-making activity involving hypothetical tokens. Complete follow-up questions about your experience. Read a written debriefing explaining the study’s full purpose and procedures.</p>\n<p>All parts of the study occur online and take approximately 20 minutes to complete. You may discontinue participation at any time before submitting the study by closing the survey before selecting “Complete,” and your responses will not be transmitted or collected by the research team.</p>\n<h4>Participant Requirements</h4>\n<p>Participants must be 18 years of age or older, reside in the United States of America, be able to read and understand English, and must not report a history of psychotic disorders, bipolar disorders, or substance use disorders, or recent experiences of hallucinations, delusions, or manic symptoms. Participation requires access to a device with internet connectivity. <strong><u>No personally identifying information is collected during participation.</u></strong></p>\n<h4>Incomplete Information</h4>\n<p>Some information about the study cannot be fully explained before participation without compromising the purpose of the study. The study therefore includes a small amount of incomplete information and simulation. These elements involve only neutral, hypothetical content and do not affect real people or real financial outcomes. All simulated elements and the reasons for using them will be fully explained during debriefing.</p>\n<h4>Benefits/Risks to Participant</h4>\n<p><strong>Benefits:</strong> There are no direct or guaranteed personal benefits to participating in this study. You may find the activity interesting or informative, and you will receive access to a brief general well-being resource.</p>\n<p><strong>Risks:</strong> This study presents no more than minimal risk. The study does not involve sensitive questions, clinical interventions, or collection of identifying information. You may experience mild frustration or discomfort while completing questionnaires, making decisions, or encountering simulated or incomplete information that is used to preserve the integrity of the study. You may skip any non-required items and may stop participation at any time without penalty or consequence.</p>\n<h4>Compensation</h4>\n<p>Since this study is completed through CloudResearch Connect, you will receive <strong>$3.50</strong> for your participation. Payment is provided for your time and effort and does not in any way depend on your responses, experimental condition, or decisions during the activity. If you discontinue before completion, CloudResearch will not have a completion record through which to issue the full study payment.</p>\n<h4>Voluntary Nature of the Study/Confidentiality</h4>\n<p>Your participation in this study is entirely voluntary, and you may discontinue at any time by closing your browser. You may skip any question you prefer not to answer with the exception of the group activity and this informed consent. All responses are anonymous. The study does not collect your name, email address, IP address, or any other identifying information. CloudResearch Connect receives only confirmation that you completed the survey; it does not receive your responses or decisions. All data are stored securely on an encrypted California Northstate University server accessible only to the research team.</p>\n<h4>Contact &amp; Questions</h4>\n<p>If you have questions about this study now or in the future, you may contact the research team using the information below:<br><strong>Principal Investigator:</strong> Dr. Krystal Piumatti, <a href=\"mailto:krystal.piumatti@cnsu.edu\">krystal.piumatti@cnsu.edu</a><br><strong>Student Co-Principal Investigator:</strong> Ehsan Azzami, <a href=\"mailto:ehsan.azzami9919@cnsu.edu\">ehsan.azzami9919@cnsu.edu</a></p>\n<p>California Northstate University (CNU) has an office that can answer questions about an individual's rights as a research participant; this office is the Institutional Review Board (IRB). The IRB is available to discuss any problems or concerns participants have about the study.<br><strong>IRB Chair:</strong> Katherine Whitcome, Ph.D., <a href=\"mailto:katherine.whitcome@cnsu.edu\">katherine.whitcome@cnsu.edu</a> or (916) 686-8533<br><strong>Director of Sponsored Programs:</strong> James Chan, <a href=\"mailto:james.chan@cnsu.edu\">james.chan@cnsu.edu</a></p>\n<h4>Statement of Consent</h4>\n<p>By selecting “Yes, I consent to participate,” I confirm that I have read and understood the above information. I understand that participation is voluntary. I have asked any questions I had regarding the experimental procedure, and they have been answered to my satisfaction. I consent to participate in this study.</p></div>"

      "name": "Reliability Manipulation",

        {
          "type": "html",
          "name": "PDF Reliable",
          "visibleIf": "{Condition} = 1 or {Condition} = 2\n",
          "html": "<div style=\"display:inline-block;text-align:left;max-width:800px\">\n<h3>10 Practical, Research-Backed Tips for Mental Wellness &amp; Daily Functioning</h3>\n<p>Simple to try, safe for most people, and suitable for everyday use.</p>\n<p><em><strong>Note:</strong> These tips are for general well-being and are not a substitute for professional medical or mental-health care. If you are struggling, consider reaching out to a qualified health professional.</em></p>\n<h4>1. Optimize your sleep.</h4>\n<p>Aim for around 7–9 hours of sleep per night and try to keep a consistent sleep schedule. Research in middle- and older-aged adults suggests that sleeping for about 7 hours per night, and avoiding both very short and very long sleep, is linked to better cognitive performance and mental health than sleeping much less or much more.¹</p>\n<h4>2. Reset with 5 minutes of breathing.</h4>\n<p>Slow, paced breathing, where your exhale lasts slightly longer than your inhale, may reduce stress and improve mood. About 5 minutes a day of structured breathing has been shown to improve mood and decrease physiological arousal.²</p>\n<h4>3. Move more, even a little.</h4>\n<p>Regular physical activity is linked to a lower risk of developing depression.³ Even small amounts of movement, below standard exercise guidelines, are associated with meaningful mental-health benefits compared with doing no activity.</p>\n<h4>4. Get outside.</h4>\n<p>Spending time in natural environments, even a nearby park, is linked to better self-reported health and well-being. People who spend roughly 2 hours per week in nature report better overall health and higher well-being than those who do not.⁴</p>\n<h4>5. Seek morning light.</h4>\n<p>Getting natural light in the morning helps regulate your body’s internal clock, which supports healthier sleep patterns and may also improve mood.⁵ Try opening your curtains shortly after waking, stepping outside for a few minutes, or taking a brief morning walk.</p>\n<h4>6. Hum or sing to self-soothe.</h4>\n<p>Gentle humming or soft vocalization can influence heart-rate variability in ways that support relaxation.⁶ Try humming when you feel stressed or as part of a wind-down routine before bed.</p>\n<h4>7. Laugh more.</h4>\n<p>Laughter can reduce stress-related physiological responses and support better mood, social connection, and overall well-being.⁷ Watch or listen to something that genuinely makes you laugh and let yourself enjoy it.</p>\n<h4>8. Try expressive writing.</h4>\n<p>Spending about 15–20 minutes writing privately about your thoughts and feelings can reduce emotional burden and contribute to mental and physical health improvements over time.⁸ Write for yourself, no pressure to edit or share.</p>\n<h4>9. Declutter one small space.</h4>\n<p>Cluttered home environments are associated with higher stress and more negative mood.⁹ Tidying a small area, like a shelf, drawer, or corner of your desk, may help create a greater sense of calm and control. Start very small if the task feels overwhelming.</p>\n<h4>10. Do a small act of kindness.</h4>\n<p>Doing something kind for someone else, even anonymously, can boost mood and increase feelings of social connection. Acts of kindness have been shown to improve well-being and reduce symptoms of depression and anxiety.¹⁰</p>\n<h4>Please Continue</h4><p>Select <strong>Next</strong> to continue. A downloadable PDF copy of these tips will be available after you complete the study.</p>\n</div>"
        },

          "html": "<div style=\"display: inline-block; text-align: left; max-width: 700px;\">\n\n  <h3>Group Decision-Making Task</h3>\n  <p><strong>Please read carefully before proceeding with the task.</strong></p>\n<br>  <p>\n    In this part of the study, you will take part in a <strong>group decision-making task</strong>\n    involving tokens. You will be placed in a group of <strong>4 anonymous participants</strong>,\n    including you.\n  </p>\n\n  <br><p>\n    Each person in the group receives <strong>10 tokens</strong>. These tokens represent\n    <strong>points used only for this study</strong> and are <strong>not redeemable for real money</strong>.\n    You will decide how many of your 10 tokens to add to the shared <strong>group pool</strong>\n    and how many to keep for yourself.\n  </p>\n\n <br> <ul>\n    <li><strong>Tokens you keep</strong> stay in your individual account.</li>\n    <li>\n      <strong>Tokens you contribute</strong> are added to the group pool, multiplied by 2, and the total\n      is then <strong>split equally</strong> among all 4 group members.\n    </li>\n  </ul>\n\n  <br><p>\n    There is <strong>no “right” or “wrong” amount</strong> to contribute. The decision is entirely up to you.\n  </p>\n\n  <br><p>\n    On the following screens, the system will set up your group. You will then see information about\n    <strong>contributions from other participants in your group</strong> before you make your own decision.\n  </p>\n\n</div>\n"

      "elements": [
        {
          "type": "html",
          "name": "Debrief",
          "html": "<div style=\"display:inline-block;text-align:left;max-width:800px\">\n<h3>Debrief</h3><p style=\"font-size:1.1em\"><strong>Thank you very much for participating in this study.</strong></p>\n<p>This research examines how experiences of reliability and cooperation influence decision-making when people must balance their own outcomes with the interests of a group. More specifically, the study examines whether an experience that appears reliable or unreliable, paired with cooperative or uncooperative behavior from other group members, affects later decisions involving shared resources. To study these questions accurately, some elements of the study were intentionally simulated and not fully explained before participation. Providing this information in advance could have changed how participants interpreted the study and responded during the Group Decision-Making Task.</p>\n<h4>Well-Being Resource</h4>\n<p>Earlier in the study, you were told you would receive a brief well-being resource. Some participants were shown the complete resource within the survey, while others saw a message stating that the requested content could not be retrieved due to a technical error. This file-access error was intentionally simulated by the researchers and was not caused by your device, internet connection, or a system malfunction. This variation was included to create an experience in which the study procedure appeared either reliable or unreliable to examine whether it would impact participants’ later judgments and decisions. Regardless of which version you encountered, you may now download the complete well-being-tips PDF below:</p>\n<p><strong>NOTE:</strong> If you choose to download the PDF, please return to this page afterward to finish reading the debriefing and submit the study for completion.</p>\n<p><a href=\"./Well-Being-Tips.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Download the complete Well-Being Tips PDF</a></p>\n<h4>Group Decision-Making Task</h4>\n<p>The other group members you saw during the Group Decision-Making Task were simulated and were not other participants completing the study in real time. Their token contributions were predetermined by the researchers so that participants would encounter either a relatively cooperative group or a relatively uncooperative group. The costly-punishment option was also simulated; choosing that option did not affect another person, and because the tokens had no monetary value, there were no real consequences resulting from contribution or punishment decisions.</p>\n<p>These simulated elements allowed the researchers to present consistent experiences across the experimental conditions that participants encountered. The use of incomplete disclosure and simulation was necessary because explaining these elements beforehand would likely have influenced participants’ expectations and behavior. All procedures, including the use of simulated group members and reliability variations, were reviewed and approved by the university’s Institutional Review Board to ensure that they meet ethical standards. There were no right or wrong decisions in this study. Your responses may help researchers better understand how people navigate uncertainty, trust, reliability, and cooperation when making decisions involving shared resources.</p>\n<h4>Questions or Concerns</h4>\n<p>If you have questions about the study’s purpose, procedures, or findings, you are welcome to contact the research team using the information provided below:</p>\n<p><strong>Principal Investigator:</strong> Dr. Krystal Piumatti, <a href=\"mailto:krystal.piumatti@cnsu.edu\">krystal.piumatti@cnsu.edu</a><br><strong>Co-Principal Investigator:</strong> Ehsan Azzami, <a href=\"mailto:ehsan.azzami9919@cnsu.edu\">ehsan.azzami9919@cnsu.edu</a></p>\n<p>California Northstate University (CNU) has an office that can answer questions about an individual's rights as a research participant; this office is the Institutional Review Board (IRB). The IRB is available to discuss any problems or concerns participants have about the study.<br><strong>IRB Chair:</strong> Katherine Whitcome, Ph.D., <a href=\"mailto:katherine.whitcome@cnsu.edu\">katherine.whitcome@cnsu.edu</a> or (916) 686-8533<br><strong>Director of Sponsored Programs:</strong> James Chan, <a href=\"mailto:james.chan@cnsu.edu\">james.chan@cnsu.edu</a></p>\n<h4>Support Resources</h4>\n<p>If you are in immediate danger or experiencing a medical or mental health emergency, call <strong>911</strong> or go to the nearest emergency room.</p>\n<p>If you or someone you know is in crisis or experiencing emotional distress, call or text <strong>988</strong> to reach the <a href=\"https://988lifeline.org\" target=\"_blank\" rel=\"noopener noreferrer\">Suicide &amp; Crisis Lifeline</a>, available 24/7.</p>\n<h5>Additional Resources</h5>\n<p><strong>Crisis Text Line</strong><br>Text <strong>HOME</strong> to <strong>741741</strong> to reach a crisis counselor 24/7.<br><a href=\"https://www.crisistextline.org\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.crisistextline.org</a></p>\n<p><strong>SAMHSA National Helpline</strong><br>Call <strong>1-800-662-HELP (4357)</strong> for confidential treatment referrals and information about mental health and substance-use services.<br><a href=\"https://www.samhsa.gov/find-help/national-helpline\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.samhsa.gov/find-help/national-helpline</a></p>\n<p><strong>NAMI HelpLine</strong><br>Call <strong>1-800-950-NAMI (6264)</strong> or text <strong>HelpLine</strong> to <strong>62640</strong> for information, support, and community mental-health resources.<br><a href=\"https://www.nami.org/help\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nami.org/help</a></p>\n<p><strong>Please select “Complete” to securely transmit your anonymous data to the research team, after which you will be returned to CloudResearch to receive completion credit.</strong></p></div>"
        }

      "type": "complete",
      "expression": "({scr_dx} contains 'Item 1') or ({scr_dx} contains 'Item 2') or ({scr_dx} contains 'Item 3') or ({scr_dx} contains 'Item 5') or ({scr_symptoms} notempty and {scr_symptoms} <> 'Item 2')"
    }
  ],
  "headerView": "advanced",
  "completeText": "Complete",
  "completedHtml": "<div style=\"text-align:center\"><h3>Submitting your responses…</h3><p>Please do not close this page.</p></div>"
};
const FLOW_URL = "https://defaultc9324e9031924368b40dc16169c276.de.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/921affcfd0fa45fdb5ad2ec60bb7f20f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=KutqeXneaTMr80LOR5jJtqxykn_p3XFet2rZlIQHxoo";
    const survey = new Survey.Model(surveyJson);

    if (Survey.StylesManager && Survey.StylesManager.applyTheme) {
      Survey.StylesManager.applyTheme("defaultV2");
    }
// CloudResearch completion routes for full completion,
// ineligible screen-out, and declined consent.
const CLOUDRESEARCH_COMPLETE_URL = "https://connect.cloudresearch.com/participant/project/7F2C0EAA73/complete";
const CLOUDRESEARCH_SCREENED_OUT_URL = "https://connect.cloudresearch.com/participant/project/AF80E6F505/complete";
const CLOUDRESEARCH_DECLINED_CONSENT_URL = "https://connect.cloudresearch.com/participant/project/FFECF6FEC7/complete";

// Connect appends these case-sensitive identifiers to the project URL. Store
// them as hidden survey values so completed research rows can be reconciled
// with Connect without displaying the identifiers to participants.
const connectParameters = new URLSearchParams(window.location.search);
["participantId", "assignmentId", "projectId"].forEach(function(parameterName) {
  const parameterValue = connectParameters.get(parameterName);
  if (parameterValue) survey.setValue(parameterName, parameterValue);
});

// Generate an unbiased random integer from 1 through 4 using the browser's
// cryptographic random-number generator. The condition is stored in the
// research payload but is never displayed to participants.
function randomCondition() {
  const range = 4;
  const limit = Math.floor(0x100000000 / range) * range;
  const values = new Uint32Array(1);
  do {
    crypto.getRandomValues(values);
  } while (values[0] >= limit);
  return (values[0] % range) + 1;
}

const assignedCondition = randomCondition();
survey.setValue("Condition", assignedCondition);
survey.setValue("AuthorityReliability", assignedCondition <= 2 ? "reliable" : "unreliable");
survey.setValue("PeerContributions", (assignedCondition === 1 || assignedCondition === 3) ? "high" : "low");

// "None" and "Prefer not to answer" cannot be combined with diagnoses.
// Likewise, "I choose not to punish anyone" cannot be combined with named
// players. This prevents contradictory required responses.
let normalizingExclusiveChoice = false;
survey.onValueChanged.add(function(sender, options) {
  if (normalizingExclusiveChoice || !Array.isArray(options.value)) return;

  let exclusiveValues = [];
  if (options.name === "scr_dx") exclusiveValues = ["Item 4", "Item 5"];
  if (options.name === "pgg_punish_high" || options.name === "pgg_punish_low") {
    exclusiveValues = ["none"];
  }
  if (!exclusiveValues.length) return;

  const newest = options.value[options.value.length - 1];
  const hasExclusive = options.value.some(value => exclusiveValues.includes(value));
  if (!hasExclusive) return;

  const normalized = exclusiveValues.includes(newest)
    ? [newest]
    : options.value.filter(value => !exclusiveValues.includes(value));

  normalizingExclusiveChoice = true;
  sender.setValue(options.name, normalized);
  normalizingExclusiveChoice = false;
});

// Keep participants on the simulated group-loading screen for the six seconds
// described in the protocol.
let loadingTimer = null;
let taskNavigationLocked = false;
survey.onCurrentPageChanged.add(function(sender) {
  if (loadingTimer) {
    clearTimeout(loadingTimer);
    loadingTimer = null;
  }

  // Once the simulated group contributions are displayed, participants may
  // only move forward. This prevents returning to the loading/manipulation
  // screens after seeing the assigned peer condition.
  if (sender.currentPage && sender.currentPage.name === "PGG Task") {
    taskNavigationLocked = true;
  }
  sender.showPrevButton = !taskNavigationLocked;

  if (sender.currentPage && sender.currentPage.name === "PGG Loading") {
    sender.showNavigationButtons = false;
    loadingTimer = setTimeout(function() {
      sender.showNavigationButtons = true;
      loadingTimer = null;
    }, 6000);
  } else {
    sender.showNavigationButtons = true;
  }
});

function isEligibleAndConsented(data) {
  const diagnoses = Array.isArray(data.scr_dx) ? data.scr_dx : [];
  return diagnoses.length === 1 && diagnoses[0] === "Item 4" &&
    data.scr_symptoms === "Item 2" &&
    data.consent === "Item 1";
}

// Each checkbox option receives its own stable Excel-ready field. Matrix
// responses are also expanded so every individual item is a separate field.
const MULTI_SELECT_COLUMNS = {
  scr_dx: {
    "Item 1": "screen_dx_bipolar",
    "Item 2": "screen_dx_psychotic",
    "Item 3": "screen_dx_substance_use",
    "Item 4": "screen_dx_none",
    "Item 5": "screen_dx_prefer_not_to_answer"
  },
  race_ethnicity: {
    "Asian": "race_asian",
    "Black / African American": "race_black_african_american",
    "Hispanic / Latino/a": "race_hispanic_latino",
    "Middle Eastern / North African": "race_middle_eastern_north_african",
    "Native American / Alaska Native": "race_native_american_alaska_native",
    "Native Hawaiian / Pacific Islander": "race_native_hawaiian_pacific_islander",
    "White / European American": "race_white_european_american",
    "other": "race_other_selected",
    "Prefer not to answer": "race_prefer_not_to_answer"
  },
  pgg_punish_high: {
    "p104": "punish_player_104",
    "p217": "punish_player_217",
    "p305": "punish_player_305",
    "none": "punish_none_high_condition"
  },
  pgg_punish_low: {
    "p412": "punish_player_412",
    "p589": "punish_player_589",
    "p630": "punish_player_630",
    "none": "punish_none_low_condition"
  }
};

// SurveyJS stores text entered for an "Other" choice under a generated
// *-Comment property. Rename those properties to stable analysis-ready fields.
const COMMENT_COLUMNS = {
  "gender-Comment": "gender_other_text",
  "race_ethnicity-Comment": "race_other_text",
  "political_party-Comment": "political_party_other_text",
  "religious_affiliation-Comment": "religious_affiliation_other_text",
  "pdf_recall-Comment": "pdf_recall_other_text",
  "pdf_interpretation-Comment": "pdf_interpretation_other_text"
};

function flattenPayload(data) {
  const flat = {};

  Object.keys(data).forEach(function(key) {
    const value = data[key];

    if (COMMENT_COLUMNS[key]) {
      flat[COMMENT_COLUMNS[key]] = value;
      return;
    }

    if (Array.isArray(value)) {
      const columnMap = MULTI_SELECT_COLUMNS[key];
      if (columnMap) {
        Object.keys(columnMap).forEach(function(choiceValue) {
          flat[columnMap[choiceValue]] = value.includes(choiceValue) ? 1 : 0;
        });
      } else {
        flat[key] = value.join(" | ");
      }
      return;
    }

    if (value && typeof value === "object") {
      Object.keys(value).forEach(function(itemKey) {
        // Matrix row names already contain their measure prefix (for example,
        // tgm_1 and pt_5), so keep those concise names when possible.
        const columnName = itemKey.startsWith(key + "_") || itemKey.startsWith("pt_")
          ? itemKey
          : key + "_" + itemKey;
        flat[columnName] = value[itemKey];
      });
      return;
    }

    flat[key] = value;
  });

  return flat;
}

function showCompletionMessage(title, message) {
  const container = document.getElementById("surveyContainer");
  container.innerHTML = '<div style="max-width:700px;margin:40px auto;padding:24px">' +
    '<h2>' + title + '</h2><p>' + message + '</p></div>';
}

survey.onComplete.add(async function(sender) {
  const rawPayload = Object.assign({}, sender.data || {});

  // Screened-out participants and people who decline consent are never sent
  // to the research-data endpoint.
  if (!isEligibleAndConsented(rawPayload)) {
    const screenedOut = rawPayload.consent === undefined;
    const exitUrl = screenedOut
      ? CLOUDRESEARCH_SCREENED_OUT_URL
      : CLOUDRESEARCH_DECLINED_CONSENT_URL;
    if (exitUrl) window.location.replace(exitUrl);
    return;
  }

  rawPayload.clientSubmittedAt = new Date().toISOString();
  const payload = flattenPayload(rawPayload);

  try {
    const response = await fetch(FLOW_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error("Submission failed with status " + response.status);

    if (CLOUDRESEARCH_COMPLETE_URL) {
      window.location.replace(CLOUDRESEARCH_COMPLETE_URL);
    } else {
      showCompletionMessage(
        "Responses submitted",
        "Your responses were submitted successfully. The CloudResearch completion URL must be configured before study launch."
      );
    }
  } catch (error) {
    showCompletionMessage(
      "We could not submit your responses",
      "Please keep this page open and contact the research team for assistance. Your browser has not redirected to CloudResearch."
    );
  }
});

document.addEventListener("DOMContentLoaded", function() {
  survey.render(document.getElementById("surveyContainer"));
});

  </script>
